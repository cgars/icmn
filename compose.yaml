services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: icmn
      POSTGRES_USER: icmn
      POSTGRES_PASSWORD: local-fictional-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icmn -d icmn"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes: ["icmn-postgres:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:5432:5432"]
  icmn:
    build: .
    environment:
      DATABASE_URL: postgres://icmn:local-fictional-only@postgres:5432/icmn?sslmode=disable
      ICMN_ADDR: :8080
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["127.0.0.1:8080:8080"]
volumes:
  icmn-postgres: {}
