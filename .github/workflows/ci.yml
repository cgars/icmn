name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  architecture-diagram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render architecture PNG from committed SVG
        run: make diagram-png verify-diagram-png
      - name: Upload architecture PNG
        uses: actions/upload-artifact@v4
        with:
          name: icmn-architecture-png-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/architecture/icmn-architecture.png
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: icmn_test
          POSTGRES_USER: icmn
          POSTGRES_PASSWORD: test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U icmn -d icmn_test"
          --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      ICMN_TEST_DATABASE_URL: postgres://icmn:test-only@127.0.0.1:5432/icmn_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: true
      - name: Formatting
        run: |
          gofmt -d $(find . -name '*.go' -type f)
          test -z "$(gofmt -l $(find . -name '*.go' -type f))"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - name: Build
        run: go build ./cmd/icmn
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean Compose build and API smoke test
        run: |
          set -euo pipefail
          project="icmn-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { docker compose --project-name "$project" down --volumes --remove-orphans; }
          trap cleanup EXIT
          docker compose --project-name "$project" up --build --detach --wait
          created="$(curl --fail --silent --show-error -X POST http://127.0.0.1:8080/v1/entities -H 'Content-Type: application/json' -d '{"kind":"organization"}')"
          id="$(printf '%s' "$created" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          curl --fail --silent --show-error "http://127.0.0.1:8080/v1/entities/$id" | python3 -c 'import json,sys; value=json.load(sys.stdin); assert value["id"]'
