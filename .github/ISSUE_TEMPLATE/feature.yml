name: Feature
description: Propose a focused ICMN capability
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or domain problem should be solved?
    validations:
      required: true
  - type: textarea
    id: invariant
    attributes:
      label: Identity/meaning invariant
      description: Which invariant in AGENTS.md applies?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable outcomes.
    validations:
      required: true
